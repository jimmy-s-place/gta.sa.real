<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>San Andreas Community Map</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet.markercluster/1.5.3/MarkerCluster.css">
  <link rel="stylesheet" href="style.css">
  <style>
    html, body { height: 100dvh; }
    #map { position: fixed; inset: 0; height: 100dvh; }
    #ig { position: fixed; right: max(10px, env(safe-area-inset-right)); bottom: max(10px, env(safe-area-inset-bottom)); z-index: 1200; display: flex; align-items: center; gap: 8px;
      padding: 6px 8px 6px 14px; border-radius: 999px; background: rgba(14,22,30,.9); color: #fff;
      font: 600 14px system-ui, sans-serif; text-decoration: none; box-shadow: 0 2px 10px rgba(0,0,0,.5); }
    #ig span.ico { width: 34px; height: 34px; border-radius: 50%; display: flex; align-items: center; justify-content: center;
      background: linear-gradient(45deg, #feda75, #fa7e1e, #d62976, #962fbf, #4f5bd5); }
    #ig svg { width: 20px; height: 20px; }
  </style>
</head>
<body>
  <div id="map"></div>

  <div id="lightbox" class="hidden"><img alt=""><p></p></div>

  <a id="ig" href="https://www.instagram.com/ammar_sju?stkn=MWE3NDhmM3Rmd3R0NQ==" target="_blank" rel="noopener noreferrer" aria-label="Photos from Instagram">
    photos from
    <span class="ico"><svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round"><rect x="3" y="3" width="18" height="18" rx="5"/><circle cx="12" cy="12" r="4"/><circle cx="17.5" cy="6.5" r="1" fill="#fff" stroke="none"/></svg></span>
  </a>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet.markercluster/1.5.3/leaflet.markercluster.js"></script>
  <script src="app.js"></script>
</body>
</html>
